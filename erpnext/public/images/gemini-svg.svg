<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Top-Left Green/Teal Gradient -->
    <linearGradient id="grad-top-green" x1="25%" y1="65%" x2="90%" y2="20%">
      <stop offset="0%" stop-color="#00A887" />
      <stop offset="35%" stop-color="#00BA88" />
      <stop offset="70%" stop-color="#23D275" />
      <stop offset="100%" stop-color="#46E367" />
    </linearGradient>

    <!-- Mid-Left Teal Fold Gradient -->
    <linearGradient id="grad-mid-teal" x1="10%" y1="20%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#00938A" />
      <stop offset="50%" stop-color="#009FA0" />
      <stop offset="100%" stop-color="#0080B0" />
    </linearGradient>

    <!-- Bottom Left Cyan/Teal Spine Gradient -->
    <linearGradient id="grad-bottom-left" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#008FA5" />
      <stop offset="60%" stop-color="#0099C0" />
      <stop offset="100%" stop-color="#009ED5" />
    </linearGradient>

    <!-- Middle Floating Horizontal Bar Gradient -->
    <linearGradient id="grad-mid-bar" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0592EA" />
      <stop offset="50%" stop-color="#1DA4FA" />
      <stop offset="100%" stop-color="#2EB5FF" />
    </linearGradient>

    <!-- Bottom Isometric Base Gradient -->
    <linearGradient id="grad-bottom-base" x1="20%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#0080FF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0052EA" />
    </linearGradient>
  </defs>

  <g id="erpnext-logo-corrected">
    <!-- 1. Top Green/Teal Arm and Outer Fold -->
    <path d="M 282 366 
             C 305 310, 360 258, 430 220 
             L 538 162 
             C 555 153, 574 153, 591 163 
             L 728 243 
             C 743 252, 747 266, 736 272 
             L 424 452 
             C 416 457, 412 465, 412 475 
             L 412 626 
             L 248 544 
             C 248 450, 258 410, 282 366 Z" fill="url(#grad-top-green)" />

    <!-- 2. Mid-Left Transition Fold -->
    <path d="M 248 544 
             L 412 460 
             L 412 626 
             L 248 642 Z" fill="url(#grad-mid-teal)" />

    <!-- 3. Bottom-Left Spine Section (Straight vertical meeting point) -->
    <path d="M 248 642 
             L 412 626 
             L 412 758 
             L 286 673 
             C 260 655, 248 648, 248 642 Z" fill="url(#grad-bottom-left)" />

    <!-- 4. Middle Floating Bar (Center branch of the 'E') -->
    <path d="M 456 500 
             L 720 388 
             C 733 382, 736 391, 736 405 
             L 736 472 
             C 736 489, 725 503, 709 510 
             L 456 608 Z" fill="url(#grad-mid-bar)" />

    <!-- 5. Bottom Base Block (Corrected: flush vertical spine, white gap, and isometric bottom chamfer) -->
    <path d="M 412 708 
             L 736 560 
             C 746 555, 751 563, 751 576 
             L 751 644 
             C 751 661, 742 677, 727 686 
             L 527 802 
             C 506 814, 480 814, 459 802 
             L 412 775 Z" fill="url(#grad-bottom-base)" />
  </g>
</svg>